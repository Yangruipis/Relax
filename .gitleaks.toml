title = "Custom Gitleaks Configuration for Relax"

# Extend the default gitleaks config to include all built-in rules
[extend]
useDefault = true

# Custom rule: Internal domain - xiaohongshu.com
[[rules]]
id = "internal-domain-xiaohongshu"
description = "Detects references to internal domain xiaohongshu.com"
regex = '''(?i)(xiaohongshu\.com|xhs\.cn)'''
tags = ["internal", "domain"]
  [rules.allowlist]
  paths = ['''scripts/ci/benchmark\.sh$''']

# Custom rule: Internal path - /mnt/
[[rules]]
id = "internal-path-mnt"
description = "Detects references to internal mount path /mnt/"
regex = '''(?i)/mnt/[^\s'"]+'''
tags = ["internal", "path"]

# Custom rule: Platform injected environment variables - QS_ prefix
[[rules]]
id = "platform-env-qs"
description = "Detects platform injected environment variables with QS_ prefix"
regex = '''\bQS_[A-Z][A-Z0-9_]*\b'''
tags = ["internal", "env"]
  [rules.allowlist]
  regexTarget = "match"
  regexes = [
    # QS_USER alone is just an env var name reference, not a leaked value
    '''^QS_USER$''',
  ]
  # The internal Quicksilver upload hook and its tests intentionally reference
  # QS_* env var names; those are identifiers, not secrets.
  paths = [
    '''scripts/tools/model_upload_hook\.py$''',
    '''tests/tools/test_model_upload_hook\.py$''',
  ]

# Custom rule: MAAS token (MAAS prefix)
[[rules]]
id = "token-maas"
description = "Detects MAAS token with MAAS prefix"
regex = '''(?i)MAAS[a-zA-Z0-9-]{16,}'''
tags = ["internal", "token"]

# Custom rule: AKID token
[[rules]]
id = "token-akid"
description = "Detects AKID token"
regex = '''(?i)AKID[a-zA-Z0-9-]{16,}'''
tags = ["internal", "token"]

# Custom rule: LTA token (LTA prefix)
[[rules]]
id = "token-lta"
description = "Detects LTA token with LTA prefix"
regex = '''\bLTA[a-zA-Z0-9-]{16,}\b'''
tags = ["internal", "token"]
  [rules.allowlist]
  regexTarget = "match"
  regexes = [
    # GatedDeltaNetContextParallel etc. are Megatron class names, not LTA tokens
    '''(?i)lta[Nn]et''',
  ]

# Custom rule: Private IP - 10.0.0.0/8 (Class A)
[[rules]]
id = "private-ip-10-range"
description = "Detects hardcoded private IP addresses in 10.0.0.0/8 range (RFC 1918)"
regex = '''\b10\.\d{1,3}\.\d{1,3}\.\d{1,3}\b(?:/\d{1,2}\b)?'''
tags = ["internal", "ip", "private"]
  [rules.allowlist]
  regexTarget = "match"
  regexes = [
    # 10.0.0.1 is a conventional placeholder IP in examples and tests.
    '''^10\.0\.0\.1$''',
    # The full RFC 1918 network is public, not a deployment-specific endpoint.
    '''^10\.0\.0\.0/8$''',
  ]
  paths = ['''scripts/ci/benchmark\.sh$''']

# Custom rule: Private IP - 172.16.0.0/12 (Class B)
[[rules]]
id = "private-ip-172-range"
description = "Detects hardcoded private IP addresses in 172.16.0.0/12 range (RFC 1918)"
regex = '''\b172\.(1[6-9]|2\d|3[01])\.\d{1,3}\.\d{1,3}\b'''
tags = ["internal", "ip", "private"]

# Custom rule: Private IP - 192.168.0.0/16 (Class C)
[[rules]]
id = "private-ip-192-168-range"
description = "Detects hardcoded private IP addresses in 192.168.0.0/16 range (RFC 1918)"
regex = '''\b192\.168\.\d{1,3}\.\d{1,3}\b'''
tags = ["internal", "ip", "private"]
  [rules.allowlist]
  regexTarget = "match"
  regexes = [
    # 192.168.1.100 is used as a conventional example endpoint in docs.
    '''^192\.168\.1\.100$''',
  ]

# NVIDIA model names disclose hardware choices; use memory + architecture profiles.
# Existing content is bypassed below by exact path AND exact original line.
# Different line text or paths require review; line numbers are not significant.
[[rules]]
id = "nvidia-gpu-model"
description = "Use GPU memory and architecture instead of concrete NVIDIA models"
regex = '''(?im)(?:^|[^a-z0-9\r\n])(?:[0-9]+[ \t]*[x×*][ \t]*)?((?:gb[23]00|b[123]00|h(?:20|100|200|800)|a(?:100|800|40)|l(?:20y?|40s?)|v100|rtx[ _-]?[0-9]{4}(?:[ _-]?ti)?))(?:$|[^a-z0-9\r\n]|[x×*][ \t]*[0-9]+)'''
secretGroup = 1
tags = ["hardware", "nvidia"]

  # Frozen baseline from ef3091ba; do not refresh it from the working tree.
  [[rules.allowlists]]
  condition = "AND"
  regexTarget = "line"
  paths = ['''^\.github/ISSUE_TEMPLATE/bug_report\.md$''']
  regexes = [
    '''(?m)^- \*\*GPU\*\*: \(e\.g\., 8x A100 80GB\)$''',
  ]

  [[rules.allowlists]]
  condition = "AND"
  regexTarget = "line"
  paths = ['''^\.github/workflows/integration-test\.yml$''']
  regexes = [
    '''(?m)^    runs-on: \[self-hosted, linux, x64, h20, gpu\]$''',
  ]

  [[rules.allowlists]]
  condition = "AND"
  regexTarget = "line"
  paths = ['''^\.github/workflows/unittest\.yml$''']
  regexes = [
    '''(?m)^    name: Unit Tests \(H20, 4 GPUs\)$''',
    '''(?m)^    runs-on: \[self-hosted, linux, x64, h20, gpu\]$''',
  ]

  [[rules.allowlists]]
  condition = "AND"
  regexTarget = "line"
  paths = ['''^docs/draft/distributed_checkpoint_service\.md$''']
  regexes = [
    '''(?m)^        "gpu_model": "A100",$''',
  ]

  [[rules.allowlists]]
  condition = "AND"
  regexTarget = "line"
  paths = ['''^relax/utils/external/command_utils\.py$''']
  regexes = [
    '''(?m)^    "GB200": "Blackwell",$''',
    '''(?m)^    "GB200": 4,$''',
    '''(?m)^    "GB300": "Blackwell",$''',
    '''(?m)^    "GB300": 4,$''',
    '''(?m)^    "H100": "Hopper",$''',
    '''(?m)^    "H100": 8,$''',
  ]

  [[rules.allowlists]]
  condition = "AND"
  regexTarget = "line"
  paths = ['''^relax/utils/training/flops_counter\.py$''']
  regexes = [
    '''(?m)^    "A100": 312e12,$''',
    '''(?m)^    "A40": 149\.7e12,$''',
    '''(?m)^    "A800": 312e12,$''',
    '''(?m)^    "B200": 2\.25e15,$''',
    '''(?m)^    "B300": 2\.25e15,$''',
    '''(?m)^    "GB200": 2\.5e15,$''',
    '''(?m)^    "GB300": 2\.5e15,$''',
    '''(?m)^    "H100": 989e12,$''',
    '''(?m)^    "H20": 148e12,$''',
    '''(?m)^    "H200": 989e12,$''',
    '''(?m)^    "H800": 989e12,$''',
    '''(?m)^    "L20": 119\.5e12,$''',
    '''(?m)^    "L20Y": 989e12,$''',
    '''(?m)^    "L40": 181\.05e12,$''',
    '''(?m)^    "L40S": 362\.05e12,$''',
    '''(?m)^    "RTX 3070 Ti": 43\.5e12,$''',
  ]

  [[rules.allowlists]]
  condition = "AND"
  regexTarget = "line"
  paths = ['''^scripts/models/deepseek-v4-flash\.sh$''']
  regexes = [
    '''(?m)^    # 0\.0 is what every upstream H100 recipe uses \(bridge/recipes/deepseek/h100/$''',
    '''(?m)^    # deepseek_v4\.py:94,174,246,331,401\); only the GB200/GB300 \*pretrain\* recipes$''',
    '''(?m)^    # entirely at coeff 0\. Every upstream recipe with fusion on \(gb200/gb300 perf\)$''',
    '''(?m)^    # sets this True; the h100 recipes leave it False only because they also force$''',
  ]

  [[rules.allowlists]]
  condition = "AND"
  regexTarget = "line"
  paths = ['''^tests/utils/test_flops_counter\.py$''']
  regexes = [
    '''(?m)^        \("NVIDIA A100-SXM4-80GB", 312e12\),$''',
    '''(?m)^        \("NVIDIA A800-SXM4-80GB", 312e12\),$''',
    '''(?m)^        \("NVIDIA H100 80GB HBM3", 989e12\),$''',
    '''(?m)^        \("NVIDIA H20", 148e12\),$''',
    '''(?m)^        \("NVIDIA H800", 989e12\),$''',
    '''(?m)^        \("NVIDIA L40S", 362\.05e12\),$''',
    '''(?m)^    common_keys = \["H100", "H800", "A100", "A800", "H20"\]$''',
    '''(?m)^    gflops = get_device_peak_flops\(unit="G", device_name="NVIDIA H100"\)$''',
    '''(?m)^    peak_tflops = get_device_peak_flops\(unit="T", device_name="NVIDIA H100 80GB HBM3"\)$''',
    '''(?m)^    tflops = get_device_peak_flops\(unit="T", device_name="NVIDIA H100"\)$''',
  ]

# Allowlist: Ignore scanner metadata and generated docs artifacts
[allowlist]
description = "Ignore scanner metadata and generated docs artifacts"
paths = [
  '''\.gitleaks\.toml$''',
  '''docs/Dockerfile''',
  '''\.git/.*''',
  '''docs/\.vitepress/(dist|cache)/.*''',
  '''^log/.*''',
  '''^logs/.*''',
  '''\.log$''',
  '''\.ruff_cache/.*''',
  '''__pycache__/.*''',
  '''\.pytest_cache/.*''',
  '''\.mypy_cache/.*''',
  '''build/.*''',
  '''\.egg-info/.*''',
  '''dist/.*''',
  '''\.ninja_log$''',
  '''\.ninja$''',
]
